name: 'superligaen'
version: '1.0.0'
profile: 'superligaen'

model-paths: ["models"]
seed-paths:  ["seeds"]
test-paths:  ["tests"]
macro-paths: ["macros"]

seeds:
  superligaen:
    +schema: silver
    referee_id_overrides:
      +column_types:
        referee_id: integer
        canonical_referee_id: integer
    team_names:
      +column_types:
        team_id: integer

models:
  superligaen:
    +post_hook: "{{ cleanup_dbt_backup() }}"
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
      # Column descriptions land as comments on the warehouse tables, so the
      # additivity rules are visible to anyone querying gold directly rather
      # than only to people reading this repo.
      +persist_docs:
        relation: true
        columns: true
