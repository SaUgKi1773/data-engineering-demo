            combination_of_columns: [transfer_id, team_sk]
    columns:
      - name: transfer_id
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: transfer_partner_team_sk
        tests: [not_null]
      - name: player_sk
        tests: [not_null]
      - name: transfer_type_sk
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7, 8, 9, -1, -2]
      - name: transfer_status_sk
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, -1, -2]
      - name: transfer_count
        tests: [not_null]

  - name: fct_match_events
    tests:
