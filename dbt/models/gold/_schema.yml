        tests: [not_null]
      - name: match_sk
        tests: [not_null]
      - name: league_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: opponent_team_sk
        tests: [not_null]
      - name: player_sk
        tests: [not_null]
      - name: team_side_sk
